name: CI
on:
  push:
    branches: [main]
  pull_request:
# A newer push to the same pull request makes the older run pointless.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
# Tests and the release bundle run side by side (3m24s one after the other, 1m40s in parallel).
# No .build cache: a fresh checkout gives every source a new mtime, so SwiftPM rebuilt everything
# from a restored cache anyway and the restore and save made the run slower (measured, #24).
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check the install scripts
        run: bash -n install.sh && bash -n uninstall.sh && bash -n scripts/bundle.sh && bash -n scripts/build-engine.sh
      - name: Build the hands engine
        run: BANEYSPACES_ARM64_ONLY=1 scripts/build-engine.sh
      - name: Test
        run: swift test
  bundle:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Bundle the app
        run: BANEYSPACES_ADHOC=1 BANEYSPACES_ARM64_ONLY=1 scripts/bundle.sh
