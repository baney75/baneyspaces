name: Release
# Pushing a version tag (git tag v0.2.2 && git push origin v0.2.2) creates the release as a DRAFT,
# with notes taken from that version's CHANGELOG section. Nobody is offered a draft.
# The prebuilt app (BaneySpaces.zip, its .sha256 and BaneySpaces.dmg) is not made here: it is
# signed with the release key, which never leaves the owner's Mac. `make release` on that Mac
# uploads the files, checks them again as uploaded and publishes the release
# (`gh release edit --draft=false --latest`), and only then the Stable channel offers it. Running
# this workflow again on an existing release only updates its notes.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tag matches VERSION
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)" || { echo "Tag $GITHUB_REF_NAME doesn't match VERSION $(cat VERSION)"; exit 1; }
      - name: Test
        run: swift test
      - name: Bundle the app
        run: BANEYSPACES_ADHOC=1 BANEYSPACES_ARM64_ONLY=1 scripts/bundle.sh
      - name: Write the notes
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Listed through the API: a draft has no public page, and `gh release view` may not find it by tag.
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq "[.[] | select(.tag_name == \"$GITHUB_REF_NAME\")] | length")" -gt 0 ]; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "BaneySpaces $(cat VERSION)" --notes-file notes.md --draft --verify-tag
          fi
