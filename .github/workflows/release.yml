name: Release
# The prebuilt app (BaneySpaces.zip, its .sha256 and BaneySpaces.dmg) is not made here: it is
# signed with the release key, which never leaves the owner's Mac. This workflow creates the
# release as a DRAFT, which nobody is offered. Then `make release` on that Mac uploads the files,
# checks them again as uploaded and publishes the release (`gh release edit --draft=false --latest`).
# A release already published keeps its state when this runs again.
# Pushing a version tag (git tag v0.2.2 && git push origin v0.2.2) publishes the stable release,
# with notes taken from that version's CHANGELOG section. The app offers it to everyone on the
# Stable channel; nothing installs until they press Update.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tag matches VERSION
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)" || { echo "Tag $GITHUB_REF_NAME doesn't match VERSION $(cat VERSION)"; exit 1; }
      - name: Test
        run: swift test
      - name: Bundle the app
        run: BANEYSPACES_ADHOC=1 BANEYSPACES_ARM64_ONLY=1 scripts/bundle.sh
      - name: Write the notes
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true ]; then
              gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
            else
              gh release edit "$GITHUB_REF_NAME" --notes-file notes.md --prerelease=false --latest
            fi
          else
            gh release create "$GITHUB_REF_NAME" --title "BaneySpaces $(cat VERSION)" --notes-file notes.md --draft --verify-tag
          fi
