name: Nightly
# Each night main changed, the tests pass and the nightly tag moves to it. The "nightly" release
# is a prerelease, so the installer and the Stable channel never pick it; people who chose the
# Nightly channel in the menu bar are offered it.
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nightly
jobs:
  nightly:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Skip if main hasn't changed
        id: changed
        run: |
          if [ "$(git rev-parse -q --verify 'refs/tags/nightly^{commit}' || true)" = "$(git rev-parse HEAD)" ]; then
            echo "Nightly is already at $(git rev-parse --short HEAD)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the hands engine
        if: steps.changed.outputs.skip != 'true'
        run: BANEYSPACES_ARM64_ONLY=1 scripts/build-engine.sh
      - name: Test
        if: steps.changed.outputs.skip != 'true'
        run: swift test
      # Ad-hoc, so this only proves the bundle builds. It is never uploaded: the updater builds
      # Nightly on the user's Mac with that Mac's signing identity.
      - name: Bundle the app
        if: steps.changed.outputs.skip != 'true'
        run: BANEYSPACES_ADHOC=1 BANEYSPACES_ARM64_ONLY=1 scripts/bundle.sh
      - name: Publish
        if: steps.changed.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The nightly release carries notes only. An app file on it would be offered as an
          # in-place update, so any file there stops the run before the tag moves.
          ASSETS=$(gh release view nightly --json assets --jq '.assets[].name' 2>/dev/null || true)
          if [ -n "$ASSETS" ]; then
            echo "The nightly release has files attached ($(echo $ASSETS)). Nightly ships no app; delete them first."
            exit 1
          fi
          scripts/release-notes.sh nightly > notes.md
          git tag -f nightly HEAD
          git push -f origin refs/tags/nightly
          TITLE="Nightly $(TZ=UTC date +%Y-%m-%d) ($(git rev-parse --short HEAD))"
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --title "$TITLE" --notes-file notes.md --prerelease --latest=false
          else
            gh release create nightly --title "$TITLE" --notes-file notes.md --prerelease --latest=false --verify-tag
          fi
  windows:
    # Windows part 1: the same checks as the PR job, and baneyspaces.exe (with the pinned hands
    # engine beside it) as the nightly artifact. Skipped until main has the Windows platform.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Is there a Windows platform on main yet?
        id: has
        shell: pwsh
        run: |
          if (Test-Path platforms/windows/baneyspaces/Cargo.toml) { "present=true" >> $env:GITHUB_OUTPUT }
      - uses: dtolnay/rust-toolchain@stable
        if: steps.has.outputs.present == 'true'
      - name: Test
        if: steps.has.outputs.present == 'true'
        run: cargo test -p baneyspaces-core -p baneyspaces-windows --locked
      - name: Release build
        if: steps.has.outputs.present == 'true'
        run: cargo build --release --locked -p baneyspaces-windows
      - name: Build the hands engine
        if: steps.has.outputs.present == 'true'
        shell: pwsh
        run: platforms/windows/scripts/build-engine.ps1
      - name: Collect
        if: steps.has.outputs.present == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/engine | Out-Null
          Copy-Item target/release/baneyspaces.exe out/
          Copy-Item platforms/windows/engine/* out/engine/
      - uses: actions/upload-artifact@v4
        if: steps.has.outputs.present == 'true'
        with:
          name: baneyspaces-windows-nightly
          path: out/
          retention-days: 14
