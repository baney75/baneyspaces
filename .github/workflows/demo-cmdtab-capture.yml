name: Demo Cmd-Tab capture
# Manual only. Stages a clean Cmd-Tab clip for marketing footage. A hosted runner usually has no
# Screen Recording or Accessibility grant, so the live clip may be missing; the render MP4 (real
# SwitcherView, fixture apps) is built every time and is the fallback.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: brew install ffmpeg
      - name: Build BaneySpaces (same ad-hoc bundle as ci.yml)
        run: BANEYSPACES_ADHOC=1 BANEYSPACES_ARM64_ONLY=1 scripts/bundle.sh
      - name: Privacy status on this runner
        continue-on-error: true
        run: |
          sw_vers
          echo "--- TCC databases (read-only listing)"
          sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "select service,client,auth_value from access where service in ('kTCCServiceScreenCapture','kTCCServiceAccessibility','kTCCServicePostEvent','kTCCServiceListenEvent');" 2>&1 || true
          sqlite3 "$HOME/Library/Application Support/com.apple.TCC/TCC.db" \
            "select service,client,auth_value from access where service in ('kTCCServiceScreenCapture','kTCCServiceAccessibility','kTCCServicePostEvent','kTCCServiceListenEvent');" 2>&1 || true
          echo "--- Accessibility trusted (AXIsProcessTrusted for swift)"
          swift -e 'import ApplicationServices; print(AXIsProcessTrusted())' 2>&1 || true
          echo "--- Screen Recording preflight"
          swift -e 'import CoreGraphics; print(CGPreflightScreenCaptureAccess())' 2>&1 || true
      - name: Render the Cmd-Tab image sequence
        run: |
          mkdir -p "$RUNNER_TEMP/render"
          build/BaneySpaces.app/Contents/MacOS/BaneySpaces --render "$RUNNER_TEMP/render"
          ls "$RUNNER_TEMP/render" | grep switcher-seq
      - name: Build the render MP4
        run: |
          mkdir -p out
          ffmpeg -y -framerate 2 -i "$RUNNER_TEMP/render/switcher-seq-%02d.png" \
            -vf "pad=ceil(iw/2)*2:ceil(ih/2)*2:color=black,format=yuv420p" \
            -c:v libx264 -movflags +faststart out/cmdtab-render.mp4
          ffprobe -v error -show_entries stream=width,height,nb_frames -of default=nw=1 out/cmdtab-render.mp4
      - name: Stage a desktop and try a live capture
        continue-on-error: true
        run: |
          mkdir -p out/live "$RUNNER_TEMP/staged"
          # Invented documents only.
          printf 'Launch checklist\n- tag the build\n- write the notes\n' > "$RUNNER_TEMP/staged/Launch checklist.txt"
          printf 'Field notes\nNothing real here.\n' > "$RUNNER_TEMP/staged/Field notes.txt"
          printf 'Inbox draft\nHello, this is a fixture.\n' > "$RUNNER_TEMP/staged/Inbox draft.txt"
          # A plain solid wallpaper (needs no secrets; may be refused without a GUI session).
          osascript -e 'tell application "System Events" to set picture of every desktop to "/System/Library/Desktop Pictures/Solid Colors/Space Gray Pro.png"' 2>&1 || echo "wallpaper: not set"
          for f in "Launch checklist" "Field notes" "Inbox draft"; do
            open -a TextEdit "$RUNNER_TEMP/staged/$f.txt" || true
            sleep 2
          done
          # Record 8 seconds in the background, press Cmd-Tab three times with CGEvent.
          screencapture -v -V 8 out/live/cmdtab-live.mov 2>&1 &
          REC=$!
          sleep 2
          swift -e '
          import CoreGraphics
          import Foundation
          func tap(_ key: CGKeyCode, _ flags: CGEventFlags) {
              for down in [true, false] {
                  let e = CGEvent(keyboardEventSource: nil, virtualKey: key, keyDown: down)
                  e?.flags = flags
                  e?.post(tap: .cghidEventTap)
              }
          }
          for _ in 0..<3 { tap(48, .maskCommand); Thread.sleep(forTimeInterval: 1.0) }
          ' 2>&1 || true
          wait $REC || echo "live capture failed (Screen Recording is likely not granted)"
          ls -la out/live
      - name: Upload the live clip
        uses: actions/upload-artifact@v4
        with:
          name: cmdtab-live
          path: out/live/
          if-no-files-found: warn
      - name: Upload the render MP4
        uses: actions/upload-artifact@v4
        with:
          name: cmdtab-render
          path: out/cmdtab-render.mp4
          if-no-files-found: error
