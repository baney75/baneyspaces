[package]
name = "baneyspaces-testapp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "A window with a text box, for the BaneySpaces live tests only. Its own exe, never single-instance."
publish = false

[[bin]]
name = "bs-testapp"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
] }
