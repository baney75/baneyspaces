[workspace]
resolver = "2"
members = ["crates/baneyspaces-core", "platforms/linux/baneyspaces", "platforms/windows/baneyspaces"]
# The pinned agent-desktop checkout (fetched by platforms/linux/scripts/build-engine.sh) is its own workspace.
exclude = ["platforms/linux/third_party", "platforms/windows/third_party"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
